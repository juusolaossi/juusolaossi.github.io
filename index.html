<title>Ossi Juusola</title>
<link rel="icon" href="favicon.ico" sizes="any">

<style>
/* ============================================================
   PALETTE — Finnish nature
   kuusi spruce #16302A · järvi lake #2E5F6E · sammal moss #5C7A4E
   jäkälä lichen #8FA37E · kallio granite #55625C
   lumi snow #F2F4F1 · koivu birch #E5E9E3
   ============================================================ */
:root{
  --kuusi:#16302A; --kuusi-2:#1E413A;
  --jarvi:#2E5F6E; --jarvi-lo:#5D93A3;
  --sammal:#5C7A4E;
  --jakala:#8FA37E; --jakala-lo:#AEBFA0;
  --kallio:#55625C;
  --lumi:#F2F4F1; --koivu:#E5E9E3; --valo:#FBFCFA;

  --display:"Familjen Grotesk",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,serif;
  --nav:16rem;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--lumi);color:var(--kuusi);
  font-family:var(--body);font-size:1.0625rem;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--jarvi);outline-offset:3px;border-radius:2px}
img{max-width:100%;display:block}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
  .rise{opacity:1!important;transform:none!important}
}

/* ============ layout scaffolding ============ */
.slab{padding:5.5rem 0;position:relative}
@media (min-width:64rem){.slab{padding:8rem 0}}
.wrap{max-width:88rem;margin:0 auto;padding:0 1.5rem}
@media (min-width:64rem){.wrap{padding:0 4rem 0 calc(var(--nav) + 2rem)}}
.measure{max-width:42rem}

.t-light{background:var(--lumi)}
.t-birch{background:var(--koivu)}
.t-dark{background:var(--kuusi);color:var(--lumi)}
.t-lake{background:var(--jarvi);color:var(--lumi)}

/* ============ fixed left nav (two stacked layers, clipped) ============ */
.sidenav{display:none}
@media (min-width:64rem){
  .sidenav{
    display:block;position:fixed;left:2.75rem;top:50%;transform:translateY(-50%);
    z-index:40;width:calc(var(--nav) - 3rem);
  }
}
.navlayer{width:100%}
.navlayer-light{position:absolute;top:0;left:0;pointer-events:none;
  clip-path:inset(0 0 100% 0)}
.navlayer ol{list-style:none;margin:0;padding:0}
.navlayer li{margin:0 0 .1rem}
.navlink{
  display:flex;align-items:center;gap:.75rem;padding:.34rem 0;
  font-family:var(--display);font-size:.82rem;letter-spacing:.02em;
  transition:color .18s;
}
.navlink .tick{width:14px;height:1px;background:currentColor;opacity:.45;
  transition:width .28s cubic-bezier(.4,0,.2,1),opacity .2s,background .18s;flex:none}
.navlink[aria-current="true"]{font-weight:600}
.navlink[aria-current="true"] .tick{width:30px;opacity:1}

/* layer A — for light backgrounds */
.navlayer-dark .navlink{color:var(--kallio)}
.navlayer-dark .navlink.hov,
.navlayer-dark .navlink[aria-current="true"]{color:var(--kuusi)}
.navlayer-dark .navlink[aria-current="true"] .tick{background:var(--jarvi)}
/* layer B — for dark backgrounds */
.navlayer-light .navlink{color:rgba(242,244,241,.55)}
.navlayer-light .navlink.hov,
.navlayer-light .navlink[aria-current="true"]{color:var(--lumi)}
.navlayer-light .navlink[aria-current="true"] .tick{background:var(--jakala)}

/* ============ language toggle, top right ============ */
.langbar{
  position:fixed;top:1.1rem;right:1.1rem;z-index:50;
  display:inline-flex;gap:2px;padding:3px;border-radius:999px;
  background:rgba(251,252,250,.82);border:1px solid var(--koivu);
  backdrop-filter:blur(8px);transition:background .3s,border-color .3s;
}
@media (min-width:64rem){.langbar{top:2rem;right:2.5rem}}
body.on-dark .langbar{background:rgba(22,48,42,.5);border-color:rgba(242,244,241,.22)}
.langbtn{
  font-family:var(--display);font-weight:600;font-size:.72rem;letter-spacing:.12em;
  text-transform:uppercase;padding:.4rem .85rem;border:0;border-radius:999px;
  background:transparent;color:var(--kallio);cursor:pointer;transition:.2s;
}
.langbtn[aria-pressed="true"]{background:var(--kuusi);color:var(--lumi)}
body.on-dark .langbtn{color:rgba(242,244,241,.6)}
body.on-dark .langbtn[aria-pressed="true"]{background:var(--lumi);color:var(--kuusi)}

/* ============ type ============ */
.eyebrow{
  font-family:var(--display);font-weight:600;font-size:.72rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--jarvi);margin:0 0 1.1rem;
}
.t-dark .eyebrow,.t-lake .eyebrow{color:var(--jakala-lo)}
h2{
  font-family:var(--display);font-weight:600;
  font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.08;letter-spacing:-.028em;
  margin:0 0 1.5rem;max-width:20ch;
}
h3{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0 0 .25rem;letter-spacing:-.005em}
p{margin:0 0 1.05rem}
p:last-child{margin-bottom:0}
.lead{font-size:clamp(1.2rem,2.2vw,1.45rem);line-height:1.5;max-width:34ch}
.meta{font-family:var(--display);font-size:.78rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--kallio);margin:0 0 .5rem}
.t-dark .meta,.t-lake .meta{color:var(--jarvi-lo)}

.rise{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1)}
.rise.in{opacity:1;transform:none}

/* ============ hero ============ */
.hero{
  min-height:100svh;display:grid;place-items:center;
  padding:5.5rem 0;background:var(--kuusi);color:var(--lumi);
}
.hero .wrap{width:100%}
.herogrid{display:grid;gap:2.25rem;align-items:center}
@media (min-width:64rem){.herogrid{grid-template-columns:1.08fr .92fr;gap:4.5rem}}
.hname{
  font-family:var(--display);font-weight:700;
  font-size:clamp(2.35rem,min(6.2vw,9.6vh),4.9rem);
  line-height:1.02;letter-spacing:-.038em;margin:0 0 1.3rem;color:var(--valo);
}
.hname em{display:block;font-style:normal;color:var(--jakala)}
.hrole{
  font-family:var(--display);font-weight:500;font-size:.76rem;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(242,244,241,.5);margin:0 0 1.25rem;
}
.hthesis{font-size:clamp(1.02rem,1.65vw,1.26rem);line-height:1.55;
  color:rgba(242,244,241,.82);max-width:38ch;margin:0}
.heroshot{
  aspect-ratio:4/5;width:100%;max-width:23rem;max-height:min(60vh,29rem);
  margin:0 0 0 auto;background:var(--valo);border-radius:5px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  border:1px solid rgba(242,244,241,.12)}
@media (max-width:63.99rem){
  .heroshot{order:-1;max-width:14rem;max-height:30vh;margin:0}
}
.heroshot img{width:100%;height:100%;object-fit:cover;object-position:center 28%}
.scrollcue{display:flex;align-items:center;gap:.6rem;margin-top:2.2rem;
  font-family:var(--display);font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(242,244,241,.45)}
.scrollcue span.line{width:44px;height:1px;background:currentColor}

/* ============ facts strip ============ */
.facts{display:grid;gap:1.4rem;margin-top:3.5rem;padding-top:2.2rem;
  border-top:1px solid var(--koivu)}
@media (min-width:48rem){.facts{grid-template-columns:repeat(4,1fr);gap:2rem}}
.fact dt{font-family:var(--display);font-size:.7rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--kallio);margin-bottom:.35rem}
.fact dd{margin:0;font-size:1rem;line-height:1.45}

/* ============ split section body ============ */
.split{display:grid;gap:2.5rem}
@media (min-width:64rem){.split{grid-template-columns:minmax(0,26rem) minmax(0,1fr);gap:5rem;align-items:start}}

/* ============ duties grid ============ */
.duties{list-style:none;margin:0;padding:0;display:grid;gap:1.75rem}
@media (min-width:48rem){.duties{grid-template-columns:repeat(2,1fr);gap:2rem 3rem}}
.duties li{border-top:1px solid rgba(242,244,241,.18);padding-top:.9rem}
.duties b{display:block;font-family:var(--display);font-size:.98rem;
  color:var(--valo);margin-bottom:.25rem;font-weight:600}
.duties span{font-size:.97rem;color:rgba(242,244,241,.72);line-height:1.55}

/* ============ experience — colour-banded cards ============ */
.legend{display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;margin:0 0 2rem;padding:0;list-style:none}
.legend li{font-family:var(--display);font-size:.74rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--kallio);display:flex;align-items:center;gap:.55rem}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block;flex:none}
.s-mark{background:var(--sammal)} .s-anal{background:var(--jarvi)} .s-serv{background:var(--kallio)}

.joblist{display:grid;gap:1rem}
.job{
  display:grid;grid-template-columns:1fr;
  background:var(--valo);border:1px solid var(--koivu);
  border-radius:5px;overflow:hidden;
}
@media (min-width:64rem){.job{grid-template-columns:12.5rem minmax(0,1fr)}}
.job .when{
  margin:0;padding:1.05rem 1.3rem;display:flex;align-items:flex-start;
  font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.11em;
  text-transform:uppercase;color:rgba(255,255,255,.96);
}
@media (min-width:64rem){.job .when{padding:1.65rem 1.4rem}}
.job.mark .when{background:var(--sammal)}
.job.anal .when{background:var(--jarvi)}
.job.serv .when{background:var(--kallio)}
.job .body{padding:1.3rem}
@media (min-width:64rem){.job .body{padding:1.65rem 1.9rem}}
.job .org{font-family:var(--display);font-size:.88rem;color:var(--jarvi);
  margin:0 0 .7rem;font-weight:500;letter-spacing:.02em}
.job p.txt{max-width:44rem;margin:0}

/* ============ education ============ */
.edu{border-top:1px solid rgba(22,48,42,.14);padding:2rem 0}
@media (min-width:64rem){.edu{display:grid;grid-template-columns:11rem minmax(0,1fr);gap:3rem}}
.edu .when{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--kallio);margin:0;padding-top:.15rem}
.edu .org{font-family:var(--display);font-size:.86rem;color:var(--jarvi);
  margin:0 0 .6rem;font-weight:500;letter-spacing:.02em}
.edu ul{margin:.6rem 0 0;padding-left:1.15rem;max-width:44rem}
.edu li{margin-bottom:.4rem}
.edulink{margin:.9rem 0 0;font-family:var(--display);font-size:.84rem}
.edulink a{color:var(--jarvi);border-bottom:1px solid rgba(46,95,110,.35);padding-bottom:1px}
.edulink a:hover{border-bottom-color:var(--jarvi)}

/* ============ skills ============ */
.skillgrid{display:grid;gap:2.5rem}
@media (min-width:48rem){.skillgrid{grid-template-columns:repeat(2,1fr);gap:3rem}}
.skillgroup h3{margin-bottom:.9rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin:0;padding:0;list-style:none}
.tags li{font-family:var(--display);font-size:.84rem;background:var(--valo);
  border:1px solid var(--koivu);color:var(--kuusi);padding:.34rem .78rem;border-radius:3px}
.t-birch .tags li{background:var(--lumi);border-color:rgba(22,48,42,.1)}

/* ============ languages ============ */
.langs{list-style:none;margin:0;padding:0;display:grid;gap:0}
.langs li{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
  padding:1.1rem 0;border-bottom:1px solid rgba(242,244,241,.2)}
.langs li:last-child{border-bottom:0}
.langs .nm{font-family:var(--display);font-size:1.15rem;font-weight:500}
.langs .rt{display:flex;align-items:center;gap:1rem}
.langs .lvl{font-family:var(--display);font-size:.74rem;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(242,244,241,.7)}
.bars{display:inline-flex;gap:4px}
.bars i{width:20px;height:4px;border-radius:2px;background:rgba(242,244,241,.22);display:block}
.bars i.on{background:var(--lumi)}

/* ============ gallery ============ */
.gallery{display:grid;gap:1rem;grid-template-columns:repeat(2,1fr)}
@media (min-width:48rem){.gallery{grid-template-columns:repeat(3,1fr);gap:1.25rem}}
.gallery figure{margin:0;aspect-ratio:3/4;background:var(--lumi);border-radius:4px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  border:1px solid rgba(22,48,42,.08)}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery figure{position:relative}
.gallery img{transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.gallery figure:hover img{transform:scale(1.04)}

/* ============ contact ============ */
.bigmail{
  font-family:var(--display);font-weight:600;
  font-size:clamp(1.5rem,5vw,3.2rem);letter-spacing:-.03em;line-height:1.1;
  color:var(--valo);display:inline-block;border-bottom:2px solid rgba(143,163,126,.45);
  padding-bottom:.15rem;transition:border-color .25s;word-break:break-word;
}
.bigmail:hover{border-bottom-color:var(--jakala)}
.contactrow{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2.5rem}
.btn{font-family:var(--display);font-weight:600;font-size:.86rem;letter-spacing:.04em;
  padding:.75rem 1.35rem;border-radius:3px;border:1px solid rgba(242,244,241,.3);
  color:var(--lumi);transition:.2s}
.btn:hover{background:rgba(242,244,241,.1);border-color:rgba(242,244,241,.55)}
.refnote{margin-top:3rem;font-family:var(--display);font-size:.86rem;
  letter-spacing:.02em;color:rgba(242,244,241,.55)}
.foot{margin-top:1.6rem;padding-top:1.4rem;border-top:1px solid rgba(242,244,241,.18);
  font-family:var(--display);font-size:.76rem;letter-spacing:.08em;color:rgba(242,244,241,.5)}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const BUILD = {
  facts: f => `<div class="fact"><dt>${esc(f.k)}</dt><dd>${esc(f.v)}</dd></div>`,
  duties: d => `<li><b>${esc(d.b)}</b><span>${esc(d.t)}</span></li>`,
  jobs: j => `<article class="job ${esc(j.k)}">
      <p class="when">${esc(j.when)}</p>
      <div class="body">
        <h3>${esc(j.title)}</h3>
        <p class="org">${esc(j.org)}</p>
        <p class="txt">${esc(j.text)}</p>
      </div>
    </article>`,
  edu: e => `<div class="edu">
      <p class="when">${esc(e.when)}</p>
      <div>
        <h3>${esc(e.title)}</h3>
        ${e.org ? `<p class="org">${esc(e.org)}</p>` : ''}
        <ul>${e.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
        ${e.link ? `<p class="edulink"><a href="${esc(e.link.url)}" target="_blank" rel="noopener">${esc(e.link.label)} &#8599;</a></p>` : ''}
      </div>
    </div>`,
  skills: s => `<div class="skillgroup"><h3>${esc(s.h)}</h3>
      <ul class="tags">${s.tags.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`,
  langs: l => `<li><span class="nm">${esc(l.n)}</span>
      <span class="rt"><span class="lvl">${esc(l.l)}</span>
      <span class="bars">${[1,2,3,4].map(i => `<i class="${i <= l.v ? 'on' : ''}"></i>`).join('')}</span></span></li>`,
  gallery: g => `<figure><img src="${esc(g.src)}" alt="${esc(g.alt)}" loading="lazy"${g.pos ? ` style="object-position:${esc(g.pos)}"` : ''}></figure>`
};

function buildNav(c){
  const html = '<ol>' + SECTIONS.map(s =>
    `<li><a class="navlink" href="#${s.id}"><span class="tick"></span><span>${esc(c[s.key])}</span></a></li>`
  ).join('') + '</ol>';
  document.getElementById('navA').innerHTML = html;
  document.getElementById('navB').innerHTML = html;
  wireNavHover();
}

/* hover must show on whichever layer is visible, so mirror it across both */
function wireNavHover(){
  const a = [...document.querySelectorAll('#navA .navlink')];
  const b = [...document.querySelectorAll('#navB .navlink')];
  a.forEach((link, i) => {
    link.addEventListener('mouseenter', () => { link.classList.add('hov'); b[i]?.classList.add('hov'); });
    link.addEventListener('mouseleave', () => { link.classList.remove('hov'); b[i]?.classList.remove('hov'); });
  });
}

function render(lang){
  const c = CONTENT[lang];
  document.documentElement.lang = c.htmlLang;
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = c[el.dataset.t];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('[data-alt]').forEach(el => {
    const v = c[el.dataset.alt];
    if (v !== undefined) el.alt = v;
  });
  document.querySelectorAll('[data-list]').forEach(el => {
    const k = el.dataset.list;
    if (Array.isArray(c[k]) && BUILD[k]) el.innerHTML = c[k].map(BUILD[k]).join('');
  });
  document.querySelectorAll('.langbtn').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  buildNav(c);
  spy();
}
document.querySelectorAll('.langbtn').forEach(b =>
  b.addEventListener('click', () => render(b.dataset.lang)));

/* ---- scrollspy + per-pixel nav contrast ---- */
const sections = [...document.querySelectorAll('main section[id]')];
const sidenav = document.querySelector('.sidenav');
const langbar = document.querySelector('.langbar');

function themeAt(y){
  for (const s of sections){
    const r = s.getBoundingClientRect();
    if (r.top <= y && r.bottom > y) return s.dataset.theme;
  }
  return 'light';
}

function spy(){
  /* 1. active section — measured at 40% of the viewport height */
  const line = innerHeight * 0.4;
  let active = sections[0];
  for (const s of sections){
    const r = s.getBoundingClientRect();
    if (r.top <= line && r.bottom > line) active = s;
  }
  document.querySelectorAll('.navlink').forEach(a => {
    a.toggleAttribute('aria-current', false);
    if (a.getAttribute('href') === '#' + active.id) a.setAttribute('aria-current','true');
  });

  /* 2. language toggle flips using the colour directly behind IT, not the page's
        "current" section — so it changes exactly as it crosses a boundary */
  const lb = langbar.getBoundingClientRect();
  document.body.classList.toggle('on-dark', themeAt(lb.top + lb.height / 2) === 'dark');

  /* 3. nav: two stacked copies. The light copy is clipped to exactly the part of
        the nav that overlaps a dark slab, so each line is correct even mid-crossing */
  const light = document.getElementById('navB');
  if (!sidenav || getComputedStyle(sidenav).display === 'none'){
    light.style.clipPath = 'inset(0 0 100% 0)';
    return;
  }
  const nr = sidenav.getBoundingClientRect();
  let top = null, bottom = null;
  for (const s of sections){
    if (s.dataset.theme !== 'dark') continue;
    const r = s.getBoundingClientRect();
    const t = Math.max(r.top, nr.top), b = Math.min(r.bottom, nr.bottom);
    if (b > t){
      top = top === null ? t : Math.min(top, t);
      bottom = bottom === null ? b : Math.max(bottom, b);
    }
  }
  light.style.clipPath = (top === null)
    ? 'inset(0 0 100% 0)'
    : `inset(${Math.max(0, top - nr.top)}px 0 ${Math.max(0, nr.bottom - bottom)}px 0)`;
}

let ticking = false;
addEventListener('scroll', () => {
  if (!ticking){ requestAnimationFrame(() => { spy(); ticking = false; }); ticking = true; }
}, {passive:true});
addEventListener('resize', spy);

render('fi');

/* ---- one restrained reveal on entry ---- */
const io = new IntersectionObserver((entries, obs) => {
  entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target); } });
}, {rootMargin:'0px 0px -12% 0px'});
document.querySelectorAll('.rise').forEach(el => io.observe(el));
</script>
